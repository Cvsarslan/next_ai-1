{% extends "templates/web.html" %}
{% block title %}Review and Sign Quotation{% endblock %}
{% block head_include %}
<style>
.navbar,.web-footer{display:none!important}.sign-page{min-height:100vh;background:#f3f7f5;padding:32px 16px;font-family:Inter,system-ui,sans-serif;color:#173b35}.sign-card{max-width:820px;margin:auto;background:#fff;border:1px solid #dce8e2;border-radius:20px;box-shadow:0 18px 55px rgba(20,64,59,.12);overflow:hidden}.sign-head{padding:24px 28px;background:linear-gradient(120deg,#123d37,#1c6658);color:#fff}.sign-head h1{font-size:1.35rem;margin:0 0 5px}.sign-head p{margin:0;color:#c9e1da}.sign-body{padding:25px 28px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px}.meta div{background:#f4f8f6;border:1px solid #e1ebe6;border-radius:10px;padding:10px}.meta small{display:block;color:#78908a;text-transform:uppercase;font-size:.65rem}.meta strong{display:block;margin-top:4px}.items{width:100%;border-collapse:collapse;margin-bottom:20px}.items th{background:#eef5f1;text-align:left;padding:9px;font-size:.72rem}.items td{padding:10px 9px;border-bottom:1px solid #e7eeea}.num{text-align:right}.sign-box{border:1px solid #dce8e2;border-radius:14px;padding:16px;background:#fafcfb}.sign-box label{display:block;font-size:.75rem;font-weight:700;margin-bottom:6px}.sign-box input[type=text]{width:100%;padding:10px;border:1px solid #cbdad3;border-radius:9px;margin-bottom:12px}.canvas-wrap{border:1px dashed #8aa79d;border-radius:10px;background:#fff;position:relative}.canvas-wrap canvas{display:block;width:100%;height:160px;touch-action:none}.clear{position:absolute;right:7px;top:7px;border:0;background:#eef5f1;border-radius:7px;padding:5px 9px;cursor:pointer}.consent{display:flex!important;gap:8px;align-items:flex-start;margin:13px 0!important;font-weight:500!important}.submit{width:100%;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55}.msg{margin-top:12px;padding:11px;border-radius:9px;display:none}.err{display:block;background:#fff1f2;color:#be123c}.ok{display:block;background:#ecfdf5;color:#047857}@media(max-width:650px){.meta{grid-template-columns:1fr 1fr}.sign-body{padding:18px}.sign-head{padding:20px}}
</style>
{% endblock %}
{% block page_content %}
<div class="sign-page"><div class="sign-card"><div class="sign-head"><h1>Quotation Review &amp; Acceptance</h1><p>Review the proposal below and sign securely.</p></div><div class="sign-body" id="app"><div style="text-align:center;padding:40px">Loading quotation...</div></div></div></div>
<script>
const token=new URLSearchParams(location.search).get('token')||'';let canvas,ctx,drawing=false,signed=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method,args={},post=false){const url='/api/method/'+method+(post?'':'?'+new URLSearchParams(args));const r=await fetch(url,{method:post?'POST':'GET',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:post?JSON.stringify(args):undefined});const d=await r.json();if(!r.ok||d.exc)throw new Error(d._server_messages?JSON.parse(JSON.parse(d._server_messages)[0]).message:'Request failed');return d.message;}
function money(v,c){return esc(c)+' '+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
async function load(){try{const q=await api('next_ai.quotation_signing.get_quotation_for_signature',{token});if(q.status==='Signed'){success(q);return;}document.getElementById('app').innerHTML=`<div class="meta"><div><small>Quotation</small><strong>${esc(q.name)}</strong></div><div><small>Customer</small><strong>${esc(q.customer)}</strong></div><div><small>Valid Till</small><strong>${esc(q.valid_till||'-')}</strong></div><div><small>Total</small><strong>${money(q.grand_total,q.currency)}</strong></div></div><table class="items"><thead><tr><th>Service / Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead><tbody>${q.items.map(x=>`<tr><td><strong>${esc(x.name)}</strong><br><small>${esc(x.description)}</small></td><td class="num">${esc(x.qty)}</td><td class="num">${money(x.rate,q.currency)}</td><td class="num">${money(x.amount,q.currency)}</td></tr>`).join('')}</tbody></table><div class="sign-box"><label>Full name of authorised signer</label><input id="signer" type="text" autocomplete="name" placeholder="Type your full legal name"><label>Draw your signature</label><div class="canvas-wrap"><canvas id="signature"></canvas><button class="clear" type="button" onclick="clearSig()">Clear</button></div><label class="consent"><input id="accept" type="checkbox"> <span>I have reviewed this quotation and accept its scope, pricing, payment terms and conditions. I confirm that I am authorised to sign for the customer.</span></label><button class="submit" id="submit" onclick="submitSig()">Accept and Sign Quotation</button><div id="msg" class="msg"></div></div>`;setupCanvas();}catch(e){document.getElementById('app').innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
function setupCanvas(){canvas=document.getElementById('signature');const ratio=devicePixelRatio||1;canvas.width=canvas.clientWidth*ratio;canvas.height=160*ratio;ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#173b35';const point=e=>{const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return [p.clientX-r.left,p.clientY-r.top]};canvas.onpointerdown=e=>{drawing=true;signed=true;ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...point(e));ctx.stroke()};window.addEventListener('pointerup',()=>drawing=false)}
function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);signed=false}
async function submitSig(){const name=document.getElementById('signer').value.trim(),accept=document.getElementById('accept').checked,msg=document.getElementById('msg'),btn=document.getElementById('submit');if(!name||!accept||!signed){msg.className='msg err';msg.textContent='Enter your full name, draw your signature, and accept the terms.';return}btn.disabled=true;btn.textContent='Creating your order and proforma...';try{const r=await api('next_ai.quotation_signing.sign_quotation',{token,signer_name:name,signature_data:canvas.toDataURL('image/png'),accepted:1},true);success(r)}catch(e){btn.disabled=false;btn.textContent='Accept and Sign Quotation';msg.className='msg err';msg.textContent=e.message}}
function success(r){document.getElementById('app').innerHTML=`<div style="text-align:center;padding:35px 10px"><div style="font-size:2rem;color:#059669">✓</div><h2>Quotation Accepted</h2><p>Thank you. Your signed acceptance has been recorded.</p>${r.sales_order?`<div class="meta" style="max-width:460px;margin:20px auto"><div><small>Sales Order</small><strong>${esc(r.sales_order)}</strong></div><div><small>Proforma Invoice</small><strong>${esc(r.proforma_invoice)}</strong></div></div><p>The proforma invoice has been emailed for payment.</p>`:''}</div>`}
load();
</script>
{% endblock %}
